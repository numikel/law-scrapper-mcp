[project]
name = "law-scrapper-mcp"
version = "4.0.2"
description = "LawScrapper MCP is an MCP server to monitoring and fetching Polish law acts published by the Polish Sejm, filters them by topic. Then with AI you can summarizes their content using an LLM."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]==2.0.0",
    "google-re2>=1.1.20251105",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "python-dateutil>=2.9",
    "markdownify>=0.14",
    "pdfplumber>=0.11.10",
    "pyjwt[crypto]>=2.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
    "mypy>=1.14",
    # mcp's streamable_http_client() types http_client as httpx2.AsyncClient,
    # not httpx.AsyncClient — needed alongside httpx for the HTTP transport test.
    "httpx2>=2.5.0",
]

[project.scripts]
law-scrapper = "law_scrapper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
override-dependencies = [
    "cryptography>=48.0.1",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "werkzeug>=3.1.6",
    "requests>=2.33.0",
    "pygments>=2.20.0",
    "click>=8.3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/law_scrapper_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = [
    "E501",    # line too long (handled by formatter)
    "N815",    # mixedCase variable in class scope (required by Sejm API field names)
    "A002",    # argument shadowing builtin (format, type — intentional)
    "UP046",   # Generic subclass style (kept for clarity)
]

[tool.ruff.lint.isort]
known-first-party = ["law_scrapper_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/**" = ["E402"]
"tests/unit/test_error_handling.py" = ["E402", "SIM117"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["law_scrapper_mcp"]
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = false

[[tool.mypy.overrides]]
module = "law_scrapper_mcp.tools.*"
disable_error_code = ["assignment"]

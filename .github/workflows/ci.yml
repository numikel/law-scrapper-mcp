name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Reject FastMCP remnants
        run: |
          if rg -n 'from fastmcp|import fastmcp|fastmcp[<=>]' pyproject.toml src tests; then
            echo "FastMCP remnants found"
            exit 1
          fi

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy src/law_scrapper_mcp/

      - name: Unit tests
        run: uv run pytest tests/unit/ -v

      - name: Integration tests
        run: uv run pytest tests/integration/ -v -m integration

      - name: Protocol transport tests
        run: uv run pytest tests/integration/test_stdio_transport.py tests/integration/test_http_transport.py -v -m integration

      - name: MCP conformance
        shell: bash
        run: |
          set -euo pipefail
          export LAW_MCP_TRANSPORT=streamable-http
          export LAW_MCP_HOST=127.0.0.1
          export LAW_MCP_PORT=7683
          uv run python -m law_scrapper_mcp >server.stdout.log 2>server.stderr.log &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          HEALTH_READY=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:7683/health >/dev/null; then
              HEALTH_READY=true
              break
            fi
            sleep 0.25
          done
          if [ "$HEALTH_READY" != "true" ]; then
            echo "Server /health did not become ready in time"
            cat server.stderr.log || true
            cat server.stdout.log || true
            exit 1
          fi
          SPEC_VERSION="$(uv run python -c 'from mcp.types import LATEST_PROTOCOL_VERSION; print(LATEST_PROTOCOL_VERSION)')"
          npx --yes @modelcontextprotocol/conformance@latest server \
            --url http://127.0.0.1:7683/mcp \
            --spec-version "$SPEC_VERSION"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject unpinned actions
        run: |
          set -euo pipefail
          if grep -rEn 'uses:\s+[^@]+@v[0-9]' .github/workflows/; then
            echo "ERROR: found actions pinned to mutable tags; pin to commit SHA"
            exit 1
          fi
          if grep -rEn 'uses:\s+[^@]+@(stable|main|master)\b' .github/workflows/; then
            echo "ERROR: found actions pinned to mutable refs; pin to commit SHA"
            exit 1
          fi
          echo "All actions pinned to SHA"

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        run: uv python install 3.13
      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: uv sync --extra dev

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Reject legacy framework remnants
        run: |
          if rg -n 'from fastmcp|import fastmcp|fastmcp[<=>]' pyproject.toml src tests; then
            echo "Legacy framework remnants found"
            exit 1
          fi

      - name: Ruff check
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff check src tests

      - name: Ruff format
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff format --check src tests

      - name: Mypy
        if: needs.changes.outputs.code == 'true'
        run: uv run mypy src/law_scrapper_mcp/
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "skipped"

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        run: uv python install 3.13
      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: uv sync --extra dev
      - name: Unit tests
        if: needs.changes.outputs.code == 'true'
        run: uv run pytest tests/unit/ -v
      - name: Integration tests
        if: needs.changes.outputs.code == 'true'
        run: uv run pytest tests/integration/ -v -m integration
      - name: Protocol transport tests
        if: needs.changes.outputs.code == 'true'
        run: uv run pytest tests/integration/test_stdio_transport.py tests/integration/test_http_transport.py -v -m integration

      - name: MCP conformance
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export LAW_MCP_TRANSPORT=streamable-http
          export LAW_MCP_HOST=127.0.0.1
          export LAW_MCP_PORT=7683
          # The conformance runner drives every scenario from one loopback peer; the
          # per-client bucket (burst 10) would answer the sweep with 429s that read
          # like protocol failures. Throttling has its own tests; this step gates
          # protocol conformance only.
          export LAW_MCP_RATE_LIMIT_ENABLED=false
          uv run python -m law_scrapper_mcp >server.stdout.log 2>server.stderr.log &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          HEALTH_READY=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:7683/health >/dev/null; then
              HEALTH_READY=true
              break
            fi
            sleep 0.25
          done
          if [ "$HEALTH_READY" != "true" ]; then
            echo "Server /health did not become ready in time"
            cat server.stderr.log || true
            cat server.stdout.log || true
            exit 1
          fi
          # Pinned exactly: the 0.2.0 alpha line is the first to accept the SDK's protocol
          # era (2026-07-28); @latest (0.1.x) still rejects it. A floating @alpha tag
          # would make CI results irreproducible between runs.
          CONFORMANCE_PKG="@modelcontextprotocol/conformance@0.2.0-alpha.11"
          SDK_SPEC_VERSION="$(uv run python -c 'from mcp.types import LATEST_PROTOCOL_VERSION; print(LATEST_PROTOCOL_VERSION)')"
          PROBE_LOG="$(mktemp)"
          set +e
          npx --yes "$CONFORMANCE_PKG" server \
            --url http://127.0.0.1:7683/mcp \
            --spec-version "$SDK_SPEC_VERSION" \
            --scenario tools-list \
            >"$PROBE_LOG" 2>&1
          PROBE_STATUS=$?
          set -e
          if grep -q "Unknown spec version" "$PROBE_LOG"; then
            # Design: do not mask upstream lag by running an older protocol era.
            # Direct STDIO/HTTP transport tests remain the mandatory protocol gate.
            echo "::warning::@modelcontextprotocol/conformance does not yet support SDK protocol ${SDK_SPEC_VERSION}; skipping suite. Transport tests remain the protocol gate."
            cat "$PROBE_LOG"
            exit 0
          fi
          if [ "$PROBE_STATUS" -ne 0 ]; then
            cat "$PROBE_LOG"
            exit "$PROBE_STATUS"
          fi
          npx --yes "$CONFORMANCE_PKG" server \
            --url http://127.0.0.1:7683/mcp \
            --spec-version "$SDK_SPEC_VERSION" \
            --expected-failures ./conformance-baseline.yml

      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "skipped"

  release-prep-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require changelog when package version changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if ! git diff "$base" "$head" -- pyproject.toml | grep -q '^[+-].*version'; then
            echo "pyproject.toml version unchanged — skip changelog check"
            exit 0
          fi
          new_version=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          changelog="docs/changelogs/v${new_version}.md"
          if git diff --name-only "$base" "$head" | grep -Fxq "$changelog"; then
            echo "Found $changelog in PR"
            exit 0
          fi
          echo "ERROR: pyproject.toml version bumped to ${new_version} but ${changelog} not added in this PR"
          exit 1

  audit:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        run: uv python install 3.13
      - name: Security audit
        if: needs.changes.outputs.code == 'true'
        run: uv run --with pip-audit pip-audit
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "skipped"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject unpinned actions
        run: |
          set -euo pipefail
          if grep -rEn 'uses:\s+[^@]+@v[0-9]' .github/workflows/; then
            echo "ERROR: found actions pinned to mutable tags; pin to commit SHA"
            exit 1
          fi
          if grep -rEn 'uses:\s+[^@]+@(stable|main|master)\b' .github/workflows/; then
            echo "ERROR: found actions pinned to mutable refs; pin to commit SHA"
            exit 1
          fi
          echo "All actions pinned to SHA"

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'modules/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'scripts/**'

  lint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        run: uv python install 3.13
      # --all-packages also installs the workspace members (modules/*), so their imports resolve.
      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: uv sync --extra dev --all-packages

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Reject legacy framework remnants
        run: |
          if rg -n 'from fastmcp|import fastmcp|fastmcp[<=>]' pyproject.toml src tests modules; then
            echo "Legacy framework remnants found"
            exit 1
          fi

      - name: Ruff check
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff check src tests modules

      - name: Ruff format
        if: needs.changes.outputs.code == 'true'
        run: uv run ruff format --check src tests modules

      # The glob names every module's import package, so a new module needs no edit here.
      - name: Mypy
        if: needs.changes.outputs.code == 'true'
        run: uv run mypy src/law_scrapper_mcp/ modules/*/src/law_scrapper_mcp_*/
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "skipped"

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        run: uv python install 3.13
      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: uv sync --extra dev
      - name: Unit tests
        if: needs.changes.outputs.code == 'true'
        run: uv run pytest tests/unit/ -v
      - name: Integration tests
        if: needs.changes.outputs.code == 'true'
        run: uv run pytest tests/integration/ -v -m integration
      - name: Protocol transport tests
        if: needs.changes.outputs.code == 'true'
        run: uv run pytest tests/integration/test_stdio_transport.py tests/integration/test_http_transport.py -v -m integration

      - name: MCP conformance
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export LAW_MCP_TRANSPORT=streamable-http
          export LAW_MCP_HOST=127.0.0.1
          export LAW_MCP_PORT=7683
          # The conformance runner drives every scenario from one loopback peer; the
          # per-client bucket (burst 10) would answer the sweep with 429s that read
          # like protocol failures. Throttling has its own tests; this step gates
          # protocol conformance only.
          export LAW_MCP_RATE_LIMIT_ENABLED=false
          uv run python -m law_scrapper_mcp >server.stdout.log 2>server.stderr.log &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          HEALTH_READY=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:7683/health >/dev/null; then
              HEALTH_READY=true
              break
            fi
            sleep 0.25
          done
          if [ "$HEALTH_READY" != "true" ]; then
            echo "Server /health did not become ready in time"
            cat server.stderr.log || true
            cat server.stdout.log || true
            exit 1
          fi
          # Pinned exactly: the 0.2.0 alpha line is the first to accept the SDK's protocol
          # era (2026-07-28); @latest (0.1.x) still rejects it. A floating @alpha tag
          # would make CI results irreproducible between runs.
          CONFORMANCE_PKG="@modelcontextprotocol/conformance@0.2.0-alpha.11"
          SDK_SPEC_VERSION="$(uv run python -c 'from mcp.types import LATEST_PROTOCOL_VERSION; print(LATEST_PROTOCOL_VERSION)')"
          PROBE_LOG="$(mktemp)"
          set +e
          npx --yes "$CONFORMANCE_PKG" server \
            --url http://127.0.0.1:7683/mcp \
            --spec-version "$SDK_SPEC_VERSION" \
            --scenario tools-list \
            >"$PROBE_LOG" 2>&1
          PROBE_STATUS=$?
          set -e
          if grep -q "Unknown spec version" "$PROBE_LOG"; then
            # Design: do not mask upstream lag by running an older protocol era.
            # Direct STDIO/HTTP transport tests remain the mandatory protocol gate.
            echo "::warning::@modelcontextprotocol/conformance does not yet support SDK protocol ${SDK_SPEC_VERSION}; skipping suite. Transport tests remain the protocol gate."
            cat "$PROBE_LOG"
            exit 0
          fi
          if [ "$PROBE_STATUS" -ne 0 ]; then
            cat "$PROBE_LOG"
            exit "$PROBE_STATUS"
          fi
          npx --yes "$CONFORMANCE_PKG" server \
            --url http://127.0.0.1:7683/mcp \
            --spec-version "$SDK_SPEC_VERSION" \
            --expected-failures ./conformance-baseline.yml

      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "skipped"

  # Source modules: the same gates as core code, run against the really installed distributions.
  # The `test` job above stays on plain `uv sync --extra dev` (no member installed), so the
  # conformance server and the transport tests there see the core only.
  modules:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        run: uv python install 3.13
      - name: Install dependencies and workspace members
        if: needs.changes.outputs.code == 'true'
        run: uv sync --extra dev --all-packages
      - name: Module tests
        if: needs.changes.outputs.code == 'true'
        run: uv run pytest modules/*/tests -v
      # The root suite sets LAW_MCP_SOURCE_MODULES=-* itself; this proves it stays core-only
      # (13 tools) even while a module is installed.
      - name: Root unit tests with a module installed
        if: needs.changes.outputs.code == 'true'
        run: uv run pytest tests/unit/ -q

      # The `test` job's conformance run sees the core only. This one starts the server with a real
      # module active (voivodeship-journals adds no tool, so `tools/list` is unchanged, but its
      # instructions block, start hook and per-host clients are live) and runs the same pinned
      # command against it. Kept as a copy of that step on purpose: the `test` job is not edited.
      - name: MCP conformance with a module active
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export LAW_MCP_TRANSPORT=streamable-http
          export LAW_MCP_HOST=127.0.0.1
          export LAW_MCP_PORT=7683
          export LAW_MCP_SOURCE_MODULES='-*,voivodeship-journals'
          # See the `test` job: one loopback peer drives every scenario, so the per-client
          # bucket would answer the sweep with 429s that read like protocol failures.
          export LAW_MCP_RATE_LIMIT_ENABLED=false
          uv run python -m law_scrapper_mcp >server.stdout.log 2>server.stderr.log &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          HEALTH_READY=false
          for attempt in {1..40}; do
            if body="$(curl --fail --silent http://127.0.0.1:7683/health)"; then
              HEALTH_READY=true
              break
            fi
            sleep 0.25
          done
          if [ "$HEALTH_READY" != "true" ]; then
            echo "Server /health did not become ready in time"
            cat server.stderr.log || true
            cat server.stdout.log || true
            exit 1
          fi
          # Proof that the module really is active in this run: its journal hosts are on /health.
          if ! grep -q '"name":"POL_WOJ_PM"' <<<"$body"; then
            echo "The module is not active: /health lists no POL_WOJ_PM source"
            echo "$body"
            exit 1
          fi
          CONFORMANCE_PKG="@modelcontextprotocol/conformance@0.2.0-alpha.11"
          SDK_SPEC_VERSION="$(uv run python -c 'from mcp.types import LATEST_PROTOCOL_VERSION; print(LATEST_PROTOCOL_VERSION)')"
          PROBE_LOG="$(mktemp)"
          set +e
          npx --yes "$CONFORMANCE_PKG" server \
            --url http://127.0.0.1:7683/mcp \
            --spec-version "$SDK_SPEC_VERSION" \
            --scenario tools-list \
            >"$PROBE_LOG" 2>&1
          PROBE_STATUS=$?
          set -e
          if grep -q "Unknown spec version" "$PROBE_LOG"; then
            # Same design as the `test` job: do not mask upstream lag by running an older era.
            echo "::warning::@modelcontextprotocol/conformance does not yet support SDK protocol ${SDK_SPEC_VERSION}; skipping suite. Transport tests remain the protocol gate."
            cat "$PROBE_LOG"
            exit 0
          fi
          if [ "$PROBE_STATUS" -ne 0 ]; then
            cat "$PROBE_LOG"
            exit "$PROBE_STATUS"
          fi
          npx --yes "$CONFORMANCE_PKG" server \
            --url http://127.0.0.1:7683/mcp \
            --spec-version "$SDK_SPEC_VERSION" \
            --expected-failures ./conformance-baseline.yml

      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "skipped"

  # The release packages, built and installed together the way an operator gets them from a GitHub
  # Release. Inside the workspace uv ignores a module's pin on the core, so this install is what proves
  # the pins resolve; `uv lock --locked` catches a version sync that left the lock behind.
  packages:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        run: uv python install 3.13
      - name: Lock file is current
        if: needs.changes.outputs.code == 'true'
        run: uv lock --locked
      - name: Build and inspect the packages
        if: needs.changes.outputs.code == 'true'
        run: uv run --no-project python scripts/check_release.py --build-packages dist
      - name: Install the wheels into a clean environment
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/release-wheels"
          uv venv --python 3.13 "$venv"
          uv pip install --python "$venv/bin/python" dist/*.whl
          "$venv/bin/python" scripts/check_release.py --check-installed
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "skipped"

  docker:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        if: needs.changes.outputs.code == 'true'
        run: docker build -t law-scrapper-mcp:ci .
      - name: Smoke-test the HTTP transport
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The image inherits the loopback bind (D19); publishing it needs the
          # explicit host override together with an auth mode, exactly as the
          # README's Docker section describes. The token is throwaway.
          docker run -d --name lsm-http -p 7683:7683             -e LAW_MCP_HOST=0.0.0.0             -e LAW_MCP_AUTH_MODE=bearer             -e LAW_MCP_AUTH_TOKEN="$(openssl rand -base64 32)"             law-scrapper-mcp:ci
          trap 'docker logs lsm-http || true; docker rm -f lsm-http >/dev/null 2>&1 || true' EXIT
          for attempt in {1..40}; do
            if body="$(curl --fail --silent http://127.0.0.1:7683/health)"; then
              echo "$body"
              grep -q '"status":"ok"' <<<"$body"
              exit 0
            fi
            sleep 0.25
          done
          echo "Container /health did not become ready in time"
          exit 1
      - name: Smoke-test the STDIO transport
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # What an MCP registry runner does: start the container on stdio and
          # send one initialize request. LAW_MCP_TRANSPORT=stdio overrides the
          # image's baked streamable-http default, so this also pins that the
          # override path works.
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          reply="$(printf '%s\n' "$request" | timeout 60 docker run -i --rm -e LAW_MCP_TRANSPORT=stdio law-scrapper-mcp:ci | head -n 1)"
          echo "${reply:0:200}"
          grep -q '"serverInfo"' <<<"$reply"
          grep -q '"law-scrapper-mcp"' <<<"$reply"
      - name: Runs as a non-root user
        if: needs.changes.outputs.code == 'true'
        run: test "$(docker run --rm --entrypoint id law-scrapper-mcp:ci -u)" != "0"
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "skipped"

  release-prep-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require changelog when package version changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if ! git diff "$base" "$head" -- pyproject.toml | grep -q '^[+-].*version'; then
            echo "pyproject.toml version unchanged — skip changelog check"
            exit 0
          fi
          new_version=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          changelog="docs/changelogs/v${new_version}.md"
          if git diff --name-only "$base" "$head" | grep -Fxq "$changelog"; then
            echo "Found $changelog in PR"
            exit 0
          fi
          echo "ERROR: pyproject.toml version bumped to ${new_version} but ${changelog} not added in this PR"
          exit 1

  audit:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        run: uv python install 3.13
      # --all-packages: dependencies that only a source module brings are audited too.
      - name: Security audit
        if: needs.changes.outputs.code == 'true'
        run: uv run --extra dev --all-packages pip-audit
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "skipped"

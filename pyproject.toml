[project]
name = "law-scrapper-mcp"
version = "4.5.0"
description = "LawScrapper MCP is an MCP server to monitoring and fetching Polish law acts published by the Polish Sejm, filters them by topic. Then with AI you can summarizes their content using an LLM."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]==2.3.0",
    "google-re2>=1.1.20251105",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "python-dateutil>=2.9",
    "markdownify>=0.14",
    "pdfplumber>=0.11.10",
    "pyjwt[crypto]>=2.10.1",
    "uvicorn>=0.31.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
    "mypy>=1.14",
    # mcp's streamable_http_client() types http_client as httpx2.AsyncClient,
    # not httpx.AsyncClient — needed alongside httpx for the HTTP transport test.
    # Floor matches the override in [tool.uv]; see the httpx2 entry there.
    "httpx2>=2.12.0",
    # tests/integration/test_output_contract.py validates structuredContent
    # against outputSchema; jsonschema is otherwise only a transitive dependency.
    "jsonschema>=4.25",
    # The CI `audit` job runs it against the locked environment; keeping it in
    # the dev extra lets `uv run pip-audit` reproduce that job locally.
    "pip-audit>=2.10.1",
]

[project.scripts]
law-scrapper = "law_scrapper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
override-dependencies = [
    "cryptography>=48.0.1",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "werkzeug>=3.1.6",
    "requests>=2.33.0",
    "pygments>=2.20.0",
    "click>=8.3.3",
    # httpx2 is a runtime dependency of mcp (which asks only for >=2.5.0) and is
    # imported at server start. 2.12.0 is the release the 4.4.0 security fix
    # locked (docs/changelogs/v4.4.0.md); the override holds that floor for uv
    # resolutions, and the dev extra repeats it for readers of this file.
    "httpx2>=2.12.0",
    # pdfplumber asks only for Pillow>=12.2.0; 13.0.0 is the first release that
    # clears the 37 advisories pip-audit reports against 12.3.0.
    "pillow>=13.0.0",
    # 2026.10.19 drops the emSign ECC Root CA - G3 (GHSA-6q48-6c7w-9gw2).
    "certifi>=2026.10.19",
    # mcp asks only for opentelemetry-api>=1.28.0; 1.45.1 fixes the tracestate
    # header ReDoS (GHSA-xcq7-p3pf-p88h) and 1.45.2 the traceparent one
    # (GHSA-mf5v-w3w3-f6cg), which mcp reaches with a value from `params._meta`.
    "opentelemetry-api>=1.45.2",
    # beautifulsoup4 (through markdownify) asks only for soupsieve>=1.6.1; 4.0 is
    # the first release clear of GHSA-mmhr-3c5m-f64f, GHSA-7g44-g9rc-x53w and
    # GHSA-6655-6qjp-jx7x. The converter matches no CSS selector, so the major
    # version changes nothing here (tests/unit/test_content_processor.py).
    "soupsieve>=4.0",
]

# Source modules live in modules/<source>/ as workspace members. A plain `uv sync` installs only the
# root project; `--all-packages` also installs the members and registers their entry points.
[tool.uv.workspace]
members = ["modules/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/law_scrapper_mcp"]

# An allowlist, not the working tree: without it a local build packs everything hatchling
# does not ignore, including gitignored private files and every workspace member under modules/.
# Hatchling adds pyproject.toml itself. Pinned by tests/unit/test_package_versions.py.
[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = [
    "E501",    # line too long (handled by formatter)
    "N815",    # mixedCase variable in class scope (required by Sejm API field names)
    "A002",    # argument shadowing builtin (format, type — intentional)
    "UP046",   # Generic subclass style (kept for clarity)
]

[tool.ruff.lint.isort]
# Source modules (modules/<source>/src/law_scrapper_mcp_<source>/) are first-party too
known-first-party = ["law_scrapper_mcp", "law_scrapper_mcp_*"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/**" = ["E402"]
"tests/unit/test_error_handling.py" = ["E402", "SIM117"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["law_scrapper_mcp"]
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = false

[[tool.mypy.overrides]]
module = "law_scrapper_mcp.tools.*"
disable_error_code = ["assignment"]

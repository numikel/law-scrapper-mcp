name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Require per-version changelog
        run: test -f "docs/changelogs/v${VERSION}.md"
      # Every version location of the core, every released module's version, its pin on the core
      # and its uv.lock line must equal the tag. Standard library only, so the runner's python3 is enough.
      - name: Require version match across every released package
        run: python3 scripts/check_release.py --version "$VERSION" --skip-tests

  build:
    name: Build packages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Same uv as the Dockerfile; tests/unit/test_ci_module_gates.py keeps them equal.
          version: "0.12.22"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # The core and every released module (all of modules/ but check_release.NEVER_RELEASED_MODULES),
      # one sdist and one wheel each; the script refuses a missing or extra file, a module wheel without
      # its exact core pin, and a core sdist that packs anything outside its allowlist.
      - name: Build sdists and wheels
        run: uv run --no-project python scripts/check_release.py --build-packages dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: docs/changelogs/v${{ env.VERSION }}.md
          files: |
            dist/*

[project]
name = "law-scrapper-mcp-saos"
version = "0.1.0"
description = "Source module for law-scrapper-mcp: Polish court judgments from SAOS (www.saos.org.pl)."
readme = "README.md"
requires-python = ">=3.13"
# Unpinned, like the reference module: the module is developed in the same workspace as the core.
dependencies = ["law-scrapper-mcp"]

[project.entry-points."law_scrapper_mcp.source_modules"]
saos = "law_scrapper_mcp_saos:module"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/law_scrapper_mcp_saos"]

[tool.uv.sources]
law-scrapper-mcp = { workspace = true }
